name: PAT diagnostic
on:
  push:
    branches: [work/burntbot/pat-diagnostic-20261103T211226Z]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubicloud-standard-2
    steps:
      - name: Probe BURNT_PAT_GITHUB_ACTIONS_TOKEN (metadata only)
        env:
          T: ${{ secrets.BURNT_PAT_GITHUB_ACTIONS_TOKEN }}
        run: |
          echo "secret length: ${#T}"
          echo "has whitespace/newline: $(printf %s "$T" | grep -c '[[:space:]]' || true)"
          echo "prefix class: $(printf %s "$T" | sed -E 's/^(ghp_|github_pat_|gho_|ghu_|ghs_).*/\1<redacted>/; t; s/.*/other/')"
          probe() { # label url
            curl -s -o /tmp/body -D /tmp/hdr -w "%{http_code}" -H "Authorization: Bearer $T" -H "Accept: application/vnd.github+json" "$2" > /tmp/code
            echo "== $1 -> HTTP $(cat /tmp/code)"
            grep -iE '^(x-oauth-scopes|x-accepted-oauth-scopes|github-authentication-token-expiration|x-github-sso|x-ratelimit-limit):' /tmp/hdr | tr -d '\r' || true
          }
          probe user https://api.github.com/user
          jq -r '"login=\(.login // "-") type=\(.type // "-") message=\(.message // "-")"' /tmp/body || true
          probe repo https://api.github.com/repos/burnt-labs/xion-types
          jq -r '"permissions=\(.permissions // "-" | tostring) message=\(.message // "-")"' /tmp/body || true
          echo "== git ls-remote with basic extraheader (as actions/checkout does)"
          B=$(printf 'x-access-token:%s' "$T" | base64 -w0)
          echo "::add-mask::$B"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $B" ls-remote https://github.com/burnt-labs/xion-types HEAD 2>&1 | sed 's/^[0-9a-f]\{40\}/<sha>/' || true
